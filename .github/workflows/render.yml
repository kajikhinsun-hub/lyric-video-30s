name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    name: Whisper QA, Typecheck, Previews & Render Final Javanese Lyric Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libs for Chrome, FFmpeg & Python QA
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64 || \
          sudo apt-get install -y ffmpeg python3-pip \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install NPM dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Cloud Whisper Javanese Timing QA (GitHub CPU)
        run: |
          pip install --break-system-packages faster-whisper || pip install faster-whisper
          python3 scripts/verify-whisper.py

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render 4 QA Preview Stills (Verse, Pre-Chorus, Chorus, Bridge)
        run: |
          mkdir -p out/previews
          npx remotion still LyricVideo out/previews/01-verse.jpg --frame=65 --image-format=jpeg --jpeg-quality=82
          npx remotion still LyricVideo out/previews/02-prechorus.jpg --frame=305 --image-format=jpeg --jpeg-quality=82
          npx remotion still LyricVideo out/previews/03-chorus.jpg --frame=475 --image-format=jpeg --jpeg-quality=82
          npx remotion still LyricVideo out/previews/04-bridge.jpg --frame=745 --image-format=jpeg --jpeg-quality=82
          ls -lh out/previews/

      - name: Render Final Javanese Lyric Video (1080x1920 @ 30fps)
        run: |
          npx remotion render LyricVideo out/raw-video.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --concurrency=2

      - name: Optimize MP4 for Universal Mobile Playback & Verify Streams
        run: |
          ffmpeg -y -i out/raw-video.mp4 \
            -c:v libx264 -profile:v high -level:v 4.1 -pix_fmt yuv420p \
            -preset medium -crf 17 -g 30 -keyint_min 30 -sc_threshold 0 \
            -r 30 -vsync cfr \
            -c:a aac -b:a 192k -ar 44100 \
            -movflags +faststart \
            out/final-javanese-lyric-video.mp4
          rm -f out/raw-video.mp4
          ls -lh out/final-javanese-lyric-video.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/final-javanese-lyric-video.mp4

      - name: Upload QA Previews & Whisper Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-previews
          path: |
            out/previews/*.jpg
            out/whisper-verification.json
          retention-days: 14

      - name: Upload Final Javanese Lyric Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-javanese-lyric-video
          path: out/final-javanese-lyric-video.mp4
          retention-days: 14

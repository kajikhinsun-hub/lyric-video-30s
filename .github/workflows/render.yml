name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    name: Typecheck & Render LyricVideo MP4 (1080x1920)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libs for Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64 || \
          sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render LyricVideo MP4 (raw)
        run: |
          npx remotion render LyricVideo out/raw-video.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --concurrency=2

      - name: Optimize MP4 for mobile & verify streams
        run: |
          ffmpeg -y -i out/raw-video.mp4 \
            -c:v libx264 -profile:v high -level:v 4.1 -pix_fmt yuv420p \
            -preset medium -crf 17 -g 30 -keyint_min 30 -sc_threshold 0 \
            -r 30 -vsync cfr \
            -c:a aac -b:a 192k -ar 44100 \
            -movflags +faststart \
            out/video.mp4
          rm -f out/raw-video.mp4
          ls -lh out/video.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,duration -of default=noprint_wrappers=1 out/video.mp4

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 14
